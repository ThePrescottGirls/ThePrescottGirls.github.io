<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>Preparing download...</title>

  <script src="https://cdn.counter.dev/script.js"
    data-id="800e0f07-e8c7-43c4-bdaf-617aab5c0504"
    data-utcoffset="-7"
    data-track-path="true"
    defer></script>
</head>
<body>
  <p>Preparing download...</p>
  <p>If nothing happens, <a id="fallback" href="/assets/downloads/An%20Overview%20%E2%80%93%20Using%20the%20Study%20Guides.pdf" download>click here</a>.</p>

  <script>
    const pdfUrl = "/assets/downloads/An%20Overview%20%E2%80%93%20Using%20the%20Study%20Guides.pdf";
    const returnUrl = "/teachers.html";

    window.addEventListener("load", function () {
      setTimeout(function () {
        const a = document.createElement("a");
        a.href = pdfUrl;
        a.setAttribute("download", "");
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
      }, 150);

      setTimeout(function () {
        window.location.replace(returnUrl);
      }, 1200);
    });
  </script>
</body>
</html>
