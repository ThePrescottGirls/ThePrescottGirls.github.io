;===============================================================================
; Oracle Configuration Template
;
; Copy this file to:
;
;     config.ini
;
; and replace the placeholder values below with your own.
;
; IMPORTANT
; ---------
; config.ini contains private credentials and should NEVER be committed
; to GitHub or any public repository.
;
; The supplied .gitignore file should exclude config.ini.
; Only config_template.ini should be checked into source control.
;===============================================================================


;===============================================================================
; Website
;===============================================================================

[project]

; Website to analyze.
;
; Discovery will automatically read:
;
;     https://your-site/sitemap.xml
;
; and create a separate SQLite database for this website.

website = https://www.example.com


;===============================================================================
; Search Provider
;===============================================================================

[search]

; Current provider:
;
;     Google Custom Search JSON API
;
; Future versions of Oracle may support additional search providers.

provider = google


; Google API Key
;
; Create a project in Google Cloud.
; Enable the Custom Search JSON API.
; Create an API key.
;
; https://console.cloud.google.com/

GOOGLE_SEARCH_API_KEY = YOUR_GOOGLE_API_KEY


; Google Programmable Search Engine ID
;
; Create a Programmable Search Engine that searches the public web.
;
; https://programmablesearchengine.google.com/

GOOGLE_SEARCH_ENGINE_ID = YOUR_SEARCH_ENGINE_ID
